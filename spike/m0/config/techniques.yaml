# 技巧词典初稿（待用户审核）
# 字段：id 供 techniques 数组引用；when 是触发条件；body 是身体怎么摆；mistake 是新手常见错误
- id: twist-lock
  name: 扭转（侧身锁定）
  when: 一只手抓着点、另一只手要往高处或对侧远处够；墙是直墙或仰角
  body: 抓点那只手同侧的髋转向墙面、肩贴墙，对侧的手顺势伸出去，手臂尽量伸直挂着
  mistake: 正对墙面硬拉，靠屈臂把身体拉上去，前臂很快就泵
- id: drop-knee
  name: 落膝
  when: 两个脚点左右分开、高度接近，手要往远处够；仰角墙尤其常用
  body: 一只脚用外侧边踩点，膝盖向下内扣，同侧髋贴墙，身体被"卡"在两个脚点之间
  mistake: 膝盖没有内扣到位，髋还是正对墙面，起不到延长距离的作用
- id: backstep
  name: 外侧踩（反踩）
  when: 需要侧身贴墙但还不需要完整落膝时
  body: 用脚的外侧边踩点，同侧髋转向墙面，是扭转的"脚上部分"
  mistake: 用脚尖正踩，髋转不过去
- id: flag
  name: 旗式
  when: 只有一侧有好脚点，身体容易像门一样甩开（甩门）
  body: 不踩点的那只腿伸到另一侧贴墙做配重，抵消身体的转动
  mistake: 腿悬空乱晃，没有贴墙产生摩擦和配重
- id: heel-hook
  name: 挂脚跟
  when: 仰角墙上，脚边有接近手高的大点或造型，可以用脚跟往下勾
  body: 脚跟放在点上，用腘绳肌发力把身体往墙里拉，分担手的拉力
  mistake: 只是把脚搭上去，没有主动收紧大腿后侧发力
- id: toe-hook
  name: 勾脚尖
  when: 仰角或屋檐，需要防止身体荡出去
  body: 脚背勾住点或造型的边缘，脚尖往回勾、绷紧
  mistake: 脚背放松，一动手脚就掉
- id: side-pull
  name: 侧拉
  when: 点的受力边朝向侧面（往左或往右）
  body: 身体往与拉力相反的方向倒，用身体重量对抗，常配合扭转
  mistake: 想像拉把手一样往下拉，抓不住
- id: undercling
  name: 反提
  when: 点的受力边朝下
  body: 手心朝上往上提，脚踩高、身体往后仰，手越接近腰部越好用
  mistake: 脚不够高，身体站得太直，提不住
- id: gaston
  name: 推撑（Gaston）
  when: 点的受力边朝外，手在身体前方，需要像推门一样往外推
  body: 肘部向外，手往外侧推，配合脚往反方向蹬
  mistake: 肘部下沉，推不出力
- id: pinch
  name: 捏
  when: 点的两侧都有可以夹住的面
  body: 拇指在一侧、其他四指在另一侧对夹，手腕保持中立
  mistake: 只用四指抠，拇指不发力
- id: match
  name: 并手
  when: 下一个手点太远，需要两只手先在同一个点上交接
  body: 先在点上给另一只手腾出位置，换手时保持身体稳定
  mistake: 点上没有留位置，换手时手指被压住
- id: foot-swap
  name: 换脚
  when: 想换另一只脚踩同一个脚点，为下一个动作调整身体朝向
  body: 一只脚抬起让位，另一只脚快速、精准地补上
  mistake: 两只脚挤在一起，重心失控
- id: high-step
  name: 高脚
  when: 下一个手点太远，但上方有可以踩的脚点
  body: 脚抬到髋附近或更高，髋贴墙把重心移到这只脚上
  mistake: 脚抬上去了，但重心还留在下面那只脚上
- id: rock-over
  name: 翻上（Rock-over）
  when: 高脚之后，需要把整个重心压到高脚上站起来
  body: 重心向高脚那侧平移、髋贴墙，用腿而不是手把身体推上去
  mistake: 靠手拉，腿没出力
- id: smear
  name: 踩墙
  when: 正墙或没有合适的脚点，墙面摩擦力足够
  body: 前脚掌贴墙、脚跟放低，重心压在脚上增加摩擦
  mistake: 脚跟抬太高、踩得太虚，脚一滑就掉
- id: hips-in
  name: 顶胯（髋贴墙）
  when: 几乎所有静态动作，尤其是直墙和仰角需要省力的时候
  body: 髋主动往墙面顶，让重心靠近墙，手臂负担变小
  mistake: 屁股往外坐，所有重量都挂在手上
- id: deadpoint
  name: 定点
  when: 下一个手点略超出静态够得到的范围
  body: 身体向上发力，在重心到达最高点、几乎"失重"的那一瞬间精准抓点
  mistake: 抓早或抓晚，或者手到了身体还在往下掉
- id: dyno
  name: 动态（跳）
  when: 下一个点远超静态和定点能够到的范围
  body: 先下沉蓄力，腿发力把身体送上去，手臂主要负责引导方向
  mistake: 用手臂拉着跳，腿没发力
- id: cross
  name: 交叉手 / 交叉脚
  when: 下一个点在对侧，而且交叉之后身体还能保持稳定
  body: 一只手从另一只手的上方或下方越过去抓点，躯干随之转向
  mistake: 交叉后身体被"锁死"，下一步动不了
- id: mantle
  name: 撑上（Mantle）
  when: TOP 是墙顶或平台，需要把身体撑上去
  body: 手掌从拉变成下压撑，脚尽快踩高
  mistake: 一直用拉的方式，到了顶上撑不上去
