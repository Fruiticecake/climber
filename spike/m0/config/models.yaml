# M0 可选模型。价格单位：美元 / 百万 token
# DeepSeek 等第三方价格请到官网查询后填写，留空时报告里的费用显示为"未知"
models:
  - id: mock
    provider: mock

  - id: claude-haiku-5-5
    provider: anthropic
    model: claude-haiku-5-5
    effort: high
    price: { input: 0.10, output: 0.50 }

  - id: claude-sonnet-5-5
    provider: anthropic
    model: claude-sonnet-5-5
    effort: high
    serverFallbacks: true
    price: { input: 2.00, output: 10.00 }

  - id: claude-opus-5-5
    provider: anthropic
    model: claude-opus-5-5
    effort: high
    serverFallbacks: true
    price: { input: 4.00, output: 20.00 }

  # DeepSeek 价格来自 https://api-docs.deepseek.com/quick_start/pricing/（2026-10-26 查询）
  # 按高峰价填写（偏保守）；工作日 UTC 01-04、06-10 点以外是半价
  - id: deepseek
    provider: openai-compat
    model: deepseek-flash
    baseUrl: https://api.deepseek.com
    apiKeyEnv: DEEPSEEK_API_KEY
    price: { input: 0.30, output: 1.20 }

  - id: deepseek-pro
    provider: openai-compat
    model: deepseek-v4-pro
    baseUrl: https://api.deepseek.com
    apiKeyEnv: DEEPSEEK_API_KEY
    price: { input: 1.32, output: 3.96 }
